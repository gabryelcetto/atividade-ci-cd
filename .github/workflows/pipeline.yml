name: Pipeline de CI/CD 

on: [push] #Inicia o gatilho

jobs:
  preparacao:
    name: Job 1 — Preparação
    runs-on: ubuntu-latest
    steps:
      - name: Início
        run: echo "Pipeline iniciado!"

  teste:
    name: Job 2 — Teste
    runs-on: ubuntu-latest
    needs: preparacao 
    steps:
      - name: Simular Testes
        run: |
          echo "Executando testes..."
          echo "Testes concluídos com sucesso!"

  finalizacao:
    name: Job 3 — Finalização
    runs-on: ubuntu-latest
    needs: teste 
    steps:
      - name: Fim
        run: echo "Pipeline finalizado com sucesso!"